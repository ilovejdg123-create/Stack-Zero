<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>STACK ZERO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:540px;margin:auto;padding:26px 16px 60px}
h1{margin:0;font-size:32px;letter-spacing:-1.5px}
.date{color:#777f8c;font-size:13px;margin:5px 0 24px}
.card{background:#151820;border:1px solid #252a34;border-radius:20px;padding:18px;margin:12px 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-size:19px;font-weight:900}
.desc{font-size:11px;color:#777f8c;margin-top:5px}
.total{text-align:right;color:#737b88;font-size:10px;letter-spacing:.5px}
.total b{display:block;color:#bfc4cc;font-size:21px;margin-top:2px}
.study-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:21px}
.round{width:52px;height:52px;border-radius:15px;background:#292e38;color:#fff;font-size:28px;font-weight:800}
.round:active{transform:scale(.94)}
.today{text-align:center;min-width:70px}
.today b{font-size:39px;line-height:1}
.today small{display:block;color:#777f8c;font-size:10px;margin-top:5px}
.check-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.status{font-size:14px;font-weight:800;color:#8c94a0}
.status.done{color:#fff}
.switch{position:relative;width:62px;height:36px;display:block}
.switch input{position:absolute;opacity:0}
.slider{position:absolute;inset:0;background:#2a2f39;border-radius:99px}
.slider:before{content:"";position:absolute;width:30px;height:30px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
.switch input:checked+.slider{background:#eee}
.switch input:checked+.slider:before{transform:translateX(26px);background:#111}
.section{font-size:21px;font-weight:900;margin:31px 2px 8px}
.section-sub{font-size:12px;color:#777f8c;margin:0 2px 12px}
.tabs{display:flex;gap:7px}
.tab{flex:1;background:#20242d;color:#929aa6;border-radius:12px;padding:11px 3px;font-weight:850}
.tab.active{background:#f5f6f8;color:#111}
.quest{position:relative;background:#151820;border:1px solid #252a34;border-radius:17px;padding:16px 14px 15px 54px;margin:9px 0;overflow:hidden}
.quest.locked{opacity:.45}
.quest.unlocked{border-color:#68717e}
.qicon{position:absolute;left:16px;top:17px;font-size:20px}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:900}
.reward{font-size:15px;margin-top:7px}
.remain{font-size:10px;color:#777f8c;margin-top:5px}
.unlocked .remain{color:#e8e9ec}
.bar{height:6px;background:#292e37;border-radius:99px;margin-top:11px}
.bar div{height:100%;background:#f5f6f8;border-radius:99px}
.quest-actions{display:flex;gap:7px;margin-top:11px}
.mini{padding:8px 10px;border-radius:10px;background:#292e38;color:#fff;font-size:12px;font-weight:800}
.mini.danger{background:#3a2024}
.mini.clear{background:#f5f6f8;color:#111}
.empty{color:#777f8c;text-align:center;padding:25px 10px}
.manage{width:100%;margin-top:25px;padding:15px;border:1px solid #252a34;border-radius:15px;background:#151820;color:#f5f6f8;font-weight:900}
.history{margin-top:22px}
.history-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #252a34;color:#aeb5bf;font-size:12px}
.history-row b{color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;display:none;padding:20px 14px;overflow:auto}
.modal{max-width:540px;margin:20px auto;background:#151820;border:1px solid #2a303b;border-radius:20px;padding:18px}
.modal h2{margin:0 0 5px;font-size:22px}
.muted{color:#777f8c;font-size:12px;margin-bottom:15px}
.form{display:grid;gap:9px}
.form input,.form select{width:100%;padding:13px;border:0;border-radius:11px;background:#292e38;color:#fff}
.form-actions{display:flex;gap:8px;margin-top:12px}
.form-actions button{flex:1;padding:13px;border-radius:11px;background:#f5f6f8;color:#111;font-weight:900}
.form-actions .cancel{background:#292e38;color:#fff}
.manager-item{background:#20242c;border-radius:13px;padding:12px;margin:8px 0}
.manager-line{display:flex;justify-content:space-between;gap:8px}
.manager-name{font-weight:900}
.manager-meta{color:#858d99;font-size:11px;margin-top:4px}
.manager-actions{display:flex;gap:6px;margin-top:9px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#f5f6f8;color:#111;border-radius:99px;padding:11px 17px;font-size:13px;font-weight:900;display:none;z-index:200}
</style>
</head>
<body>
<div class="app">
  <h1>STACK ZERO</h1>
  <div class="date" id="date"></div>
  <div id="daily"></div>

  <div class="section">🏆 QUEST</div>
  <div class="section-sub">스택형 퀘스트는 누적으로 자동 해금 · 필요조건형은 직접 달성</div>
  <div class="tabs">
    <button class="tab active" data-type="study" type="button">📚 공부</button>
    <button class="tab" data-type="exercise" type="button">🏃 운동</button>
    <button class="tab" data-type="sleep" type="button">😴 잠</button>
  </div>
  <div id="quests"></div>
  <button class="manage" id="manageBtn" type="button">⚙️ QUEST 관리</button>

  <div class="card history">
    <div class="head"><div class="title">📅 기록</div><div class="desc">00:00 자동 저장</div></div>
    <div id="history"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>⚙️ QUEST 관리</h2>
    <div class="muted">퀘스트 추가·수정·삭제, 보상과 조건을 모두 바꿀 수 있습니다</div>
    <button class="manage" id="addBtn" type="button" style="margin-top:0">＋ 새 QUEST 추가</button>
    <div id="managerList"></div>
    <div class="form-actions"><button class="cancel" id="closeManager" type="button">닫기</button></div>
  </div>
</div>

<div class="overlay" id="editorOverlay">
  <div class="modal">
    <h2 id="editorTitle">QUEST 추가</h2>
    <div class="muted">스택형은 누적 STACK 달성 시 자동 해금됩니다</div>
    <div class="form">
      <input id="qName" placeholder="퀘스트 이름">
      <input id="qReward" placeholder="보상 이름">
      <select id="qType">
        <option value="study">📚 공부</option>
        <option value="exercise">🏃 운동</option>
        <option value="sleep">😴 잠</option>
      </select>
      <select id="qMode">
        <option value="stack">STACK 조건으로 자동 해금</option>
        <option value="manual">필요조건 충족 후 직접 달성</option>
      </select>
      <input id="qNeed" type="number" min="0" placeholder="필요 STACK (스택형에서 사용)">
      <input id="qCondition" placeholder="필요조건 설명 (직접 달성형)">
    </div>
    <div class="form-actions">
      <button class="cancel" id="cancelEditor" type="button">취소</button>
      <button id="saveQuest" type="button">저장</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

const KEY="STACK_ZERO_FINAL_V3";
const DEFAULT_QUESTS={
  study:[
    {id:"s1",name:"첫 번째 보상",reward:"🎮 토요일 PC방 3~4시간",mode:"stack",need:50},
    {id:"s2",name:"영화",reward:"🎬 영화",mode:"stack",need:300},
    {id:"s3",name:"만화카페",reward:"📖 만화카페",mode:"stack",need:700},
    {id:"s4",name:"쇼핑",reward:"👕 10만원 쇼핑",mode:"stack",need:1000},
    {id:"s5",name:"특별 보상",reward:"🎁 특별 보상",mode:"stack",need:1500},
    {id:"s6",name:"최종 보상",reward:"💻 편입 합격 → 노트북",mode:"stack",need:2000}
  ],
  exercise:[
    {id:"e1",name:"자유식권",reward:"🍽️ 자유식권 1장",mode:"stack",need:30},
    {id:"e2",name:"운동용품",reward:"🏋️ 운동용품",mode:"stack",need:100},
    {id:"e3",name:"큰 운동 보상",reward:"🏆 1년 운동 기록 보상",mode:"stack",need:365}
  ],
  sleep:[
    {id:"p1",name:"좋은 카페",reward:"☕ 좋은 카페",mode:"stack",need:30},
    {id:"p2",name:"옷",reward:"👕 10만원치 옷 1벌",mode:"stack",need:100},
    {id:"p3",name:"신발",reward:"👟 원하는 신발",mode:"stack",need:200},
    {id:"p4",name:"쇼핑",reward:"🛍️ 20만원 쇼핑",mode:"stack",need:300},
    {id:"p5",name:"큰 보상",reward:"🎁 큰 생활 보상",mode:"stack",need:500}
  ]
};

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x && x.date && x.today && x.total && x.quests) return x;
  }catch(e){}
  return {date:todayKey(),today:{study:0,exercise:0,sleep:0},total:{study:0,exercise:0,sleep:0},history:[],quests:JSON.parse(JSON.stringify(DEFAULT_QUESTS)),manualDone:{}};
}
let state=load(), active="study", editId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function rollover(){
  const t=todayKey();
  if(state.date===t)return false;
  state.history=state.history||[];
  state.history.unshift({date:state.date,study:state.today.study,exercise:state.today.exercise,sleep:state.today.sleep});
  state.history=state.history.slice(0,90);
  state.date=t;
  state.today={study:0,exercise:0,sleep:0};
  state.manualDone={};
  save();
  return true;
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.style.display="block";
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display="none",1300);
}
function setToday(type,value){
  rollover();
  if(type==="study")value=Math.max(0,Math.min(14,value));
  else value=value?1:0;
  const old=state.today[type];
  const diff=value-old;
  state.today[type]=value;
  state.total[type]=Math.max(0,state.total[type]+diff);
  save();render();
}
function study(delta){setToday("study",state.today.study+delta)}
function check(type,on){setToday(type,on?1:0)}

function render(){
  const changed=rollover();
  const d=new Date();
  const days=["일","월","화","수","목","금","토"];
  document.getElementById("date").textContent=
    `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")} ${days[d.getDay()]}`;

  document.getElementById("daily").innerHTML=`
  <section class="card">
    <div class="head"><div><div class="title">📚 공부</div><div class="desc">하루 0~14 STACK · 1시간 = 1 STACK</div></div><div class="total">TOTAL<b>${state.total.study}</b></div></div>
    <div class="study-row"><button class="round" id="minus" type="button">−</button><div class="today"><b>${state.today.study}</b><small>TODAY / 14</small></div><button class="round" id="plus" type="button">＋</button></div>
  </section>
  <section class="card">
    <div class="head"><div><div class="title">🏃 운동</div><div class="desc">오늘 목표 달성 → 1 STACK</div></div><div class="total">TOTAL<b>${state.total.exercise}</b></div></div>
    <div class="check-row"><span class="status ${state.today.exercise?'done':''}">오늘 ${state.today.exercise} STACK</span><label class="switch"><input id="exercise" type="checkbox" ${state.today.exercise?'checked':''}><span class="slider"></span></label></div>
  </section>
  <section class="card">
    <div class="head"><div><div class="title">😴 잠</div><div class="desc">수면 조건 달성 → 1 STACK</div></div><div class="total">TOTAL<b>${state.total.sleep}</b></div></div>
    <div class="check-row"><span class="status ${state.today.sleep?'done':''}">오늘 ${state.today.sleep} STACK</span><label class="switch"><input id="sleep" type="checkbox" ${state.today.sleep?'checked':''}><span class="slider"></span></label></div>
  </section>`;

  document.getElementById("minus").onclick=()=>study(-1);
  document.getElementById("plus").onclick=()=>study(1);
  document.getElementById("exercise").onchange=e=>check("exercise",e.target.checked);
  document.getElementById("sleep").onchange=e=>check("sleep",e.target.checked);
  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("active",b.dataset.type===active);
    b.onclick=()=>{active=b.dataset.type;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));renderQuest()}
  });
  renderQuest();renderHistory();
}

function renderQuest(){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.type===active));
  const total=state.total[active], list=(state.quests[active]||[]).slice().sort((a,b)=>{
    if(a.mode==="stack"&&b.mode==="stack")return Number(a.need)-Number(b.need);
    if(a.mode==="stack")return -1;if(b.mode==="stack")return 1;return 0;
  });
  const el=document.getElementById("quests");
  if(!list.length){el.innerHTML='<div class="empty">아직 QUEST가 없습니다</div>';return}
  el.innerHTML=list.map(q=>{
    const done=q.mode==="stack"?total>=Number(q.need):!!state.manualDone[q.id];
    const pct=q.mode==="stack"?Math.min(100,(total/Math.max(1,Number(q.need)))*100):(done?100:0);
    return `<div class="quest ${done?'unlocked':'locked'}">
      <div class="qicon">${done?'🔓':'🔒'}</div>
      <div class="qtop"><span>${q.mode==="stack"?q.need+" STACK":"필요조건"}</span><span>${done?"QUEST CLEAR":"LOCKED"}</span></div>
      <div class="reward">${escapeHtml(q.reward)}</div>
      <div class="remain">${q.mode==="stack"?(done?"보상 조건 달성":"현재 "+total+" / "+q.need+" STACK"):(q.condition||"직접 달성 필요")}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      ${q.mode==="manual"?`<div class="quest-actions"><button class="mini clear" data-clear="${q.id}">${done?"달성 취소":"달성"}</button></div>`:""}
    </div>`;
  }).join("");
  el.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.clear;state.manualDone[id]=!state.manualDone[id];save();renderQuest();toast(state.manualDone[id]?"QUEST 해금":"QUEST 잠금")
  });
}
function renderHistory(){
  const el=document.getElementById("history");
  if(!state.history.length){el.innerHTML='<div class="empty">아직 저장된 날짜가 없습니다</div>';return}
  el.innerHTML=state.history.slice(0,14).map(x=>`<div class="history-row"><b>${x.date}</b><span>📚 ${x.study} · 🏃 ${x.exercise} · 😴 ${x.sleep}</span></div>`).join("");
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function openManager(){renderManager();document.getElementById("overlay").style.display="block"}
function renderManager(){
  const all=[];
  ["study","exercise","sleep"].forEach(type=>(state.quests[type]||[]).forEach(q=>all.push({...q,type})));
  document.getElementById("managerList").innerHTML=all.length?all.map(q=>`
    <div class="manager-item">
      <div class="manager-line"><span class="manager-name">${escapeHtml(q.name)}</span><span>${q.type==="study"?"📚":q.type==="exercise"?"🏃":"😴"}</span></div>
      <div class="manager-meta">${q.mode==="stack"?q.need+" STACK 자동 해금":"필요조건형 · "+escapeHtml(q.condition||"직접 달성")} → ${escapeHtml(q.reward)}</div>
      <div class="manager-actions"><button class="mini" data-edit="${q.id}">수정</button><button class="mini danger" data-del="${q.id}">삭제</button></div>
    </div>`).join(""):'<div class="empty">QUEST 없음</div>';
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!confirm("이 QUEST를 삭제할까요?"))return;
    const id=b.dataset.del;
    ["study","exercise","sleep"].forEach(t=>state.quests[t]=state.quests[t].filter(q=>q.id!==id));
    delete state.manualDone[id];save();renderManager();renderQuest();toast("삭제했습니다");
  });
}
function openEditor(id){
  editId=id||null;
  let q=null;
  if(id)for(const t of ["study","exercise","sleep"]){q=state.quests[t].find(x=>x.id===id);if(q)break}
  document.getElementById("editorTitle").textContent=q?"QUEST 수정":"QUEST 추가";
  document.getElementById("qName").value=q?q.name:"";
  document.getElementById("qReward").value=q?q.reward:"";
  document.getElementById("qType").value=q?getType(q.id):active;
  document.getElementById("qMode").value=q?q.mode:"stack";
  document.getElementById("qNeed").value=q&&q.mode==="stack"?q.need:"";
  document.getElementById("qCondition").value=q&&q.mode==="manual"?q.condition||"":"";
  document.getElementById("editorOverlay").style.display="block";
}
function getType(id){for(const t of ["study","exercise","sleep"])if(state.quests[t].some(q=>q.id===id))return t;return active}
function saveEditor(){
  const name=document.getElementById("qName").value.trim(),reward=document.getElementById("qReward").value.trim(),type=document.getElementById("qType").value,mode=document.getElementById("qMode").value,need=Math.max(0,Number(document.getElementById("qNeed").value||0)),condition=document.getElementById("qCondition").value.trim();
  if(!name||!reward){toast("이름과 보상을 입력해주세요");return}
  if(mode==="stack"&&!need){toast("필요 STACK을 입력해주세요");return}
  if(mode==="manual"&&!condition){toast("필요조건을 입력해주세요");return}
  if(editId){
    let oldType=getType(editId),q=state.quests[oldType].find(x=>x.id===editId);
    state.quests[oldType]=state.quests[oldType].filter(x=>x.id!==editId);
    q={...q,name,reward,type,mode,need,condition};
    state.quests[type].push(q);
  }else{
    const id="q_"+Date.now();
    state.quests[type].push({id,name,reward,mode,need,condition});
  }
  save();document.getElementById("editorOverlay").style.display="none";render();renderManager();toast("저장했습니다");
}
document.getElementById("manageBtn").onclick=openManager;
document.getElementById("closeManager").onclick=()=>document.getElementById("overlay").style.display="none";
document.getElementById("addBtn").onclick=()=>openEditor(null);
document.getElementById("cancelEditor").onclick=()=>document.getElementById("editorOverlay").style.display="none";
document.getElementById("saveQuest").onclick=saveEditor;

render();
setInterval(()=>{const before=state.date;if(rollover()||before!==state.date)render()},10000);
})();
</script>
</body>
</html>
