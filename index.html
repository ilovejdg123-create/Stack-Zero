<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>STACK ZERO</title>
<style>
*{box-sizing:border-box}
:root{--accent:#f5f6f8;--accent2:#bfc4cc;--glow:rgba(245,246,248,.18);--bg:#0b0d12;--card:#151820;--line:#252a34}
body{margin:0;background:var(--bg);color:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:540px;margin:auto;padding:24px 16px 70px}
h1{margin:0;font-size:32px;letter-spacing:-1.5px}
.date{color:#777f8c;font-size:13px;margin:5px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 0 0 0 var(--glow);transition:.25s}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-size:19px;font-weight:900}.desc{font-size:11px;color:#777f8c;margin-top:5px}
.total{text-align:right;color:#737b88;font-size:10px;letter-spacing:.5px}.total b{display:block;color:var(--accent2);font-size:21px;margin-top:2px}
.study-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:21px}
.round{width:52px;height:52px;border-radius:15px;background:#292e38;color:#fff;font-size:28px;font-weight:800}.round:active{transform:scale(.94)}
.today{text-align:center;min-width:70px}.today b{font-size:39px;line-height:1}.today small{display:block;color:#777f8c;font-size:10px;margin-top:5px}
.check-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.status{font-size:14px;font-weight:800;color:#8c94a0}.status.done{color:#fff}
.switch{position:relative;width:62px;height:36px;display:block}.switch input{position:absolute;opacity:0}.slider{position:absolute;inset:0;background:#2a2f39;border-radius:99px}.slider:before{content:"";position:absolute;width:30px;height:30px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(26px);background:#111}
.level-card{position:relative;overflow:hidden;border-color:var(--accent2);background:linear-gradient(145deg,var(--card),rgba(255,255,255,.02));box-shadow:0 0 25px var(--glow)}
.level-card:after{content:"";position:absolute;inset:-50%;background:radial-gradient(circle at 70% 20%,var(--glow),transparent 35%);pointer-events:none}
.level-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.gem{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,var(--gem1),var(--gem2));box-shadow:0 0 16px var(--glow),inset 0 1px 2px rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.35)}
.level-name{font-size:24px;font-weight:950}.level-range{font-size:11px;color:#8c94a0;margin-top:3px}.level-total{margin-left:auto;text-align:right}.level-total b{font-size:30px;color:var(--accent)}.level-bar{height:7px;background:#292e37;border-radius:99px;margin-top:15px;overflow:hidden;position:relative;z-index:1}.level-bar div{height:100%;width:0;background:linear-gradient(90deg,var(--gem1),var(--accent));border-radius:99px;transition:.35s;box-shadow:0 0 10px var(--glow)}
.section{font-size:21px;font-weight:900;margin:31px 2px 8px}.section-sub{font-size:12px;color:#777f8c;margin:0 2px 12px}
.quest-tabs{display:flex;gap:7px}.quest-tabs .quest-tab{flex:1;background:#20242d;color:#929aa6;border-radius:12px;padding:11px 3px;font-weight:850}.quest-tabs .quest-tab.active{background:var(--accent);color:#111;box-shadow:0 0 15px var(--glow)}
.quest{position:relative;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px 14px 15px 54px;margin:9px 0;overflow:hidden}.quest.locked{opacity:.45}.quest.unlocked{border-color:var(--accent2);box-shadow:0 0 14px var(--glow)}
.qicon{position:absolute;left:16px;top:17px;font-size:20px}.qtop{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:900}.reward{font-size:15px;margin-top:7px}.remain{font-size:10px;color:#777f8c;margin-top:5px}.unlocked .remain{color:#e8e9ec}
.bar{height:6px;background:#292e37;border-radius:99px;margin-top:11px}.bar div{height:100%;background:var(--accent);border-radius:99px}
.quest-actions{display:flex;gap:7px;margin-top:11px}.mini{padding:8px 10px;border-radius:10px;background:#292e38;color:#fff;font-size:12px;font-weight:800}.mini.danger{background:#3a2024}.mini.clear{background:var(--accent);color:#111}
.empty{color:#777f8c;text-align:center;padding:25px 10px}
.bottom-tools{display:flex;gap:8px;margin-top:14px}.tool-btn{flex:1;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:#f5f6f8;font-weight:900}.tool-btn.small{flex:0 0 105px}
.history{margin-top:22px}.history-row{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);color:#aeb5bf;font-size:12px}.history-row b{color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:99;display:none;padding:20px 14px;overflow:auto}.modal{max-width:540px;margin:20px auto;background:#151820;border:1px solid #2a303b;border-radius:20px;padding:18px}.modal h2{margin:0 0 5px;font-size:22px}.muted{color:#777f8c;font-size:12px;margin-bottom:15px}
.form{display:grid;gap:9px}.form input,.form select{width:100%;padding:13px;border:0;border-radius:11px;background:#292e38;color:#fff}.form-actions{display:flex;gap:8px;margin-top:12px}.form-actions button{flex:1;padding:13px;border-radius:11px;background:var(--accent);color:#111;font-weight:900}.form-actions .cancel{background:#292e38;color:#fff}
.manager-item{background:#20242c;border-radius:13px;padding:12px;margin:8px 0}.manager-line{display:flex;justify-content:space-between;gap:8px}.manager-name{font-weight:900}.manager-meta{color:#858d99;font-size:11px;margin-top:4px}.manager-actions{display:flex;gap:6px;margin-top:9px}.manager-actions .mini{flex:1}
.history-edit{background:#20242c;border-radius:13px;padding:12px;margin:8px 0}.history-edit input{width:100%;padding:10px;border:0;border-radius:9px;background:#292e38;color:#fff;margin:4px 0}.history-edit .row{display:flex;gap:6px}.history-edit button{flex:1}
.celebrate{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:25px;background:rgba(0,0,0,.78)}.celebrate-box{width:min(430px,100%);text-align:center;padding:30px 22px;border-radius:28px;background:linear-gradient(145deg,#181b24,#0e1016);border:1px solid var(--accent2);box-shadow:0 0 45px var(--glow);animation:pop .25s ease}.celebrate-gem{font-size:52px}.celebrate h2{font-size:26px;margin:10px 0}.celebrate p{color:#c7cbd2;line-height:1.55;margin:8px 0 20px}.celebrate button{padding:13px 30px;border-radius:12px;background:var(--accent);color:#111;font-weight:900}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:var(--accent);color:#111;border-radius:99px;padding:11px 17px;font-size:13px;font-weight:900;display:none;z-index:200;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<h1>STACK ZERO</h1><div class="date" id="date"></div><div id="level"></div><div id="daily"></div>

<div class="section">🏆 QUEST</div>
<div class="section-sub">공부 · 운동 · 잠을 눌러 원하는 퀘스트를 확인하세요</div>
<div class="quest-tabs" id="questTabs">
<button class="quest-tab active" data-type="study" type="button">📚 공부</button>
<button class="quest-tab" data-type="exercise" type="button">🏃 운동</button>
<button class="quest-tab" data-type="sleep" type="button">😴 잠</button>
</div>
<div id="quests"></div>
<div class="bottom-tools">
<button class="tool-btn" id="manageBtn" type="button">⚙️ QUEST 관리</button>
<button class="tool-btn small" id="historyBtn" type="button">📋 기록지</button>
</div>
</div>

<div class="overlay" id="overlay"><div class="modal">
<h2>⚙️ QUEST 관리</h2><div class="muted">현재 보고 있는 종류의 QUEST를 수정 · 삭제 · 위/아래 이동할 수 있습니다</div>
<button class="tool-btn" id="addBtn" type="button">＋ 새 QUEST 추가</button>
<div id="managerList"></div>
<div class="form-actions"><button class="cancel" id="closeManager" type="button">닫기</button></div>
</div></div>

<div class="overlay" id="editorOverlay"><div class="modal">
<h2 id="editorTitle">QUEST 추가</h2><div class="muted">STACK형은 누적 STACK 달성 시 자동 CLEAR됩니다</div>
<div class="form">
<input id="qName" placeholder="퀘스트 이름"><input id="qReward" placeholder="보상 이름">
<select id="qType"><option value="study">📚 공부</option><option value="exercise">🏃 운동</option><option value="sleep">😴 잠</option></select>
<select id="qMode"><option value="stack">STACK 조건으로 자동 달성</option><option value="manual">필요조건 충족 후 직접 달성</option></select>
<input id="qNeed" type="number" min="1" placeholder="필요 STACK"><input id="qCondition" placeholder="필요조건 설명">
</div><div class="form-actions"><button class="cancel" id="cancelEditor" type="button">취소</button><button id="saveQuest" type="button">저장</button></div>
</div></div>

<div class="overlay" id="historyOverlay"><div class="modal">
<h2>📋 기록지</h2><div class="muted">지난 기록을 직접 수정하거나 삭제할 수 있습니다</div><div id="historyEditor"></div>
<div class="form-actions"><button class="cancel" id="closeHistory" type="button">닫기</button></div>
</div></div>

<div class="celebrate" id="celebrate"><div class="celebrate-box">
<div class="celebrate-gem" id="celebrateGem">🏆</div><h2 id="celebrateTitle">축하드립니다!</h2><p id="celebrateText"></p><button id="celebrateClose" type="button">확인</button>
</div></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";
const KEY="STACK_ZERO_FINAL_V4";
const LEVELS=[
{min:0,max:100,name:"뉴비",gem:"🪨",g1:"#5a4a3b",g2:"#a58b70",label:"흙"},
{min:100,max:200,name:"입문자",gem:"🪵",g1:"#5b321c",g2:"#c58a55",label:"나무"},
{min:200,max:300,name:"노력가",gem:"⚙️",g1:"#626b78",g2:"#d7dde5",label:"강철"},
{min:300,max:500,name:"학습자",gem:"🟡",g1:"#8d5d00",g2:"#ffe28a",label:"금"},
{min:500,max:700,name:"실력자",gem:"💎",g1:"#4d8dff",g2:"#e7f3ff",label:"다이아"},
{min:700,max:1000,name:"강자",gem:"🔮",g1:"#39205d",g2:"#bd72ff",label:"흑요석"},
{min:1000,max:1300,name:"상위권",gem:"♦️",g1:"#650018",g2:"#ff5878",label:"루비"},
{min:1300,max:1500,name:"전설",gem:"👑",g1:"#6a1598",g2:"#ffd1ff",label:"전설"},
{min:1500,max:Infinity,name:"전설",gem:"👑",g1:"#7d18b5",g2:"#fff0ff",label:"전설"}
];
const CHEERS=["오늘의 한 STACK이 내일의 실력이 됩니다","조금씩 쌓아도 멈추지 않으면 결국 차이가 납니다","지금까지 쌓은 건 사라지지 않습니다","한 단계 올랐습니다 이제 다음 단계로 갑니다","남들이 쉬는 순간에도 쌓은 기록은 남습니다","완벽보다 누적이 강합니다"];
const DEFAULT_QUESTS={
study:[
{id:"s1",name:"첫 번째 보상",reward:"🎮 토요일 PC방 3~4시간",mode:"stack",need:50},
{id:"s2",name:"영화",reward:"🎬 영화",mode:"stack",need:300},
{id:"s3",name:"만화카페",reward:"📖 만화카페",mode:"stack",need:700},
{id:"s4",name:"쇼핑",reward:"👕 10만원 쇼핑",mode:"stack",need:1000},
{id:"s5",name:"특별 보상",reward:"🎁 특별 보상",mode:"stack",need:1500},
{id:"s6",name:"최종 보상",reward:"💻 편입 합격 → 노트북",mode:"stack",need:2000}
],
exercise:[
{id:"e1",name:"자유식권",reward:"🍽️ 자유식권 1장",mode:"stack",need:30},
{id:"e2",name:"운동용품",reward:"🏋️ 운동용품",mode:"stack",need:100},
{id:"e3",name:"큰 운동 보상",reward:"🏆 1년 운동 기록 보상",mode:"stack",need:365}
],
sleep:[
{id:"p1",name:"좋은 카페",reward:"☕ 좋은 카페",mode:"stack",need:30},
{id:"p2",name:"옷",reward:"👕 10만원치 옷 1벌",mode:"stack",need:100},
{id:"p3",name:"신발",reward:"👟 원하는 신발",mode:"stack",need:200},
{id:"p4",name:"쇼핑",reward:"🛍️ 20만원 쇼핑",mode:"stack",need:300},
{id:"p5",name:"큰 보상",reward:"🎁 큰 생활 보상",mode:"stack",need:500}
]};
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fresh(){return {date:todayKey(),today:{study:0,exercise:0,sleep:0},total:{study:0,exercise:0,sleep:0},history:[],quests:JSON.parse(JSON.stringify(DEFAULT_QUESTS)),manualDone:{},celebratedQuests:{},celebratedLevels:[]}}
function load(){
try{
let raw=localStorage.getItem(KEY);
if(!raw){
  for(const oldKey of ["STACK_ZERO_FINAL_V3","STACK_ZERO","STACK_ZERO_FINAL"]){
    const candidate=localStorage.getItem(oldKey);
    if(candidate){raw=candidate;break}
  }
}
const x=JSON.parse(raw||"null");
if(x&&x.date&&x.today&&x.total&&x.quests){x.history=x.history||[];x.manualDone=x.manualDone||{};x.celebratedQuests=x.celebratedQuests||{};x.celebratedLevels=x.celebratedLevels||[];return x}}catch(e){}
return fresh()
}
let state=load(),active="study",editId=null
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function rollover(){
const t=todayKey();if(state.date===t)return false
state.history=state.history||[];state.history.unshift({date:state.date,study:state.today.study,exercise:state.today.exercise,sleep:state.today.sleep});state.history=state.history.slice(0,90)
state.date=t;state.today={study:0,exercise:0,sleep:0};state.manualDone={};save();return true
}
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display="none",1400)}
function levelFor(n){let x=LEVELS[0];for(const l of LEVELS)if(n>=l.min)x=l;return x}
function levelIndex(n){let i=0;for(let j=0;j<LEVELS.length;j++)if(n>=LEVELS[j].min)i=j;return i}
function applyTheme(l){document.documentElement.style.setProperty("--gem1",l.g1);document.documentElement.style.setProperty("--gem2",l.g2);document.documentElement.style.setProperty("--accent",l.g2);document.documentElement.style.setProperty("--accent2",l.g2);document.documentElement.style.setProperty("--glow",l.g2+"55")}
function renderLevel(){
const total=state.total.study,l=levelFor(total),idx=levelIndex(total),next=LEVELS[idx+1],base=l.min,end=l.max===Infinity?Math.max(total,base+1):l.max
const pct=next?Math.min(100,((total-base)/(next.min-base))*100):100
applyTheme(l)
document.getElementById("level").innerHTML=`<section class="card level-card"><div class="level-top"><div class="gem">${l.gem}</div><div><div class="level-name">${l.name}</div><div class="level-range">STACK ${l.max===Infinity?l.min+"+":l.min+"~"+(l.max-1)} · ${l.label}</div></div><div class="level-total"><span>STUDY STACK</span><b>${total}</b></div></div><div class="level-bar"><div style="width:${pct}%"></div></div></section>`
}
function showCelebrate(title,text,gem){
document.getElementById("celebrateGem").textContent=gem||"🏆";document.getElementById("celebrateTitle").textContent=title;document.getElementById("celebrateText").textContent=text;document.getElementById("celebrate").style.display="flex"
}
function setToday(type,value){
rollover();
const beforeTotal={...state.total},beforeStudy=state.total.study;
if(type==="study")value=Math.max(0,Math.min(14,value));else value=value?1:0;
const old=state.today[type],diff=value-old;
state.today[type]=value;
state.total[type]=Math.max(0,state.total[type]+diff);
save();
if(diff>0) detectQuestClears(beforeTotal);
if(type==="study" && diff>0) checkLevelUp(beforeStudy,state.total.study);
render();
}
function study(d){setToday("study",state.today.study+d)}function check(t,on){setToday(t,on?1:0)}
function render(){
rollover();const d=new Date(),days=["일","월","화","수","목","금","토"]
document.getElementById("date").textContent=`${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")} ${days[d.getDay()]}`
renderLevel()
document.getElementById("daily").innerHTML=`
<section class="card"><div class="head"><div><div class="title">📚 공부</div><div class="desc">하루 0~14 STACK · 1시간 = 1 STACK</div></div><div class="total">TOTAL<b>${state.total.study}</b></div></div>
<div class="study-row"><button class="round" id="minus" type="button">−</button><div class="today"><b>${state.today.study}</b><small>TODAY / 14</small></div><button class="round" id="plus" type="button">＋</button></div></section>
<section class="card"><div class="head"><div><div class="title">🏃 운동</div><div class="desc">오늘 목표 달성 → 1 STACK</div></div><div class="total">TOTAL<b>${state.total.exercise}</b></div></div>
<div class="check-row"><span class="status ${state.today.exercise?'done':''}">오늘 ${state.today.exercise} STACK</span><label class="switch"><input id="exercise" type="checkbox" ${state.today.exercise?'checked':''}><span class="slider"></span></label></div></section>
<section class="card"><div class="head"><div><div class="title">😴 잠</div><div class="desc">수면 조건 달성 → 1 STACK</div></div><div class="total">TOTAL<b>${state.total.sleep}</b></div></div>
<div class="check-row"><span class="status ${state.today.sleep?'done':''}">오늘 ${state.today.sleep} STACK</span><label class="switch"><input id="sleep" type="checkbox" ${state.today.sleep?'checked':''}><span class="slider"></span></label></div></section>`
document.getElementById("minus").onclick=()=>study(-1);document.getElementById("plus").onclick=()=>study(1)
document.getElementById("exercise").onchange=e=>check("exercise",e.target.checked);document.getElementById("sleep").onchange=e=>check("sleep",e.target.checked)
document.querySelectorAll(".quest-tab").forEach(b=>b.onclick=()=>{active=b.dataset.type;renderQuest()})
renderQuest();renderHistory()
}
function updateTabs(){document.querySelectorAll(".quest-tab").forEach(x=>x.classList.toggle("active",x.dataset.type===active))}
function renderQuest(){
updateTabs();const total=state.total[active],list=state.quests[active]||[],el=document.getElementById("quests")
if(!list.length){el.innerHTML='<div class="empty">아직 QUEST가 없습니다</div>';return}
el.innerHTML=list.map(q=>{const done=q.mode==="stack"?total>=Number(q.need):!!state.manualDone[q.id],pct=q.mode==="stack"?Math.min(100,total/Math.max(1,Number(q.need))*100):(done?100:0)
return `<div class="quest ${done?'unlocked':'locked'}"><div class="qicon">${done?'🔓':'🔒'}</div><div class="qtop"><span>${q.mode==="stack"?q.need+" STACK":"필요조건"}</span><span>${done?"QUEST CLEAR":"LOCKED"}</span></div><div class="reward">${escapeHtml(q.name)} · ${escapeHtml(q.reward)}</div><div class="remain">${q.mode==="stack"?(done?"보상 조건 달성":"현재 "+total+" / "+q.need+" STACK"):(q.condition||"직접 달성 필요")}</div><div class="bar"><div style="width:${pct}%"></div></div>${q.mode==="manual"?`<div class="quest-actions"><button class="mini clear" data-clear="${q.id}">${done?"달성 취소":"달성"}</button></div>`:""}</div>`}).join("")
el.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{const id=b.dataset.clear;const was=!!state.manualDone[id];state.manualDone[id]=!was;save();renderQuest();if(!was)questCelebrate(id)})
}
function questCelebrate(id){
if(state.celebratedQuests[id])return
state.celebratedQuests[id]=true;save()
let q=null;for(const t of ["study","exercise","sleep"]){q=(state.quests[t]||[]).find(x=>x.id===id);if(q)break}
if(q)showCelebrate("축하드립니다!","「"+q.name+"」 퀘스트를 달성하셨습니다 🎉\\n"+q.reward,"🏆")
}
function detectQuestClears(beforeTotals){
for(const t of ["study","exercise","sleep"])for(const q of state.quests[t]||[]){
if(q.mode!=="stack")continue
const before=Number(beforeTotals[t]||0),after=Number(state.total[t]||0),need=Number(q.need)
if(before<need&&after>=need)questCelebrate(q.id)
}}
function studyWithChecks(d){
const before={...state.total};setToday("study",state.today.study+d);detectQuestClears(before)
}
function openManager(){renderManager();document.getElementById("overlay").style.display="block"}
function renderManager(){
const list=state.quests[active]||[]
document.getElementById("managerList").innerHTML=list.length?list.map((q,i)=>`<div class="manager-item"><div class="manager-line"><span class="manager-name">${i+1}. ${escapeHtml(q.name)}</span><span>${active==="study"?"📚":active==="exercise"?"🏃":"😴"}</span></div><div class="manager-meta">${q.mode==="stack"?q.need+" STACK 자동 달성":"필요조건형 · "+escapeHtml(q.condition||"직접 달성")} → ${escapeHtml(q.reward)}</div><div class="manager-actions"><button class="mini" data-up="${q.id}" ${i===0?"disabled":""}>↑</button><button class="mini" data-down="${q.id}" ${i===list.length-1?"disabled":""}>↓</button><button class="mini" data-edit="${q.id}">수정</button><button class="mini danger" data-del="${q.id}">삭제</button></div></div>`).join(""):'<div class="empty">이 종류의 QUEST가 없습니다</div>'
document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveQuest(b.dataset.up,-1));document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveQuest(b.dataset.down,1))
document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteQuest(b.dataset.del))
}
function moveQuest(id,dir){const a=state.quests[active],i=a.findIndex(q=>q.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();renderManager();renderQuest()}
function deleteQuest(id){if(!confirm("이 QUEST를 삭제할까요?"))return;state.quests[active]=state.quests[active].filter(q=>q.id!==id);delete state.manualDone[id];delete state.celebratedQuests[id];save();renderManager();renderQuest();toast("삭제했습니다")}
function openEditor(id){
editId=id||null;let q=null,t=active;if(id)for(const type of ["study","exercise","sleep"]){q=(state.quests[type]||[]).find(x=>x.id===id);if(q){t=type;break}}
document.getElementById("editorTitle").textContent=q?"QUEST 수정":"QUEST 추가";document.getElementById("qName").value=q?q.name:"";document.getElementById("qReward").value=q?q.reward:"";document.getElementById("qType").value=t;document.getElementById("qMode").value=q?q.mode:"stack";document.getElementById("qNeed").value=q&&q.mode==="stack"?q.need:"";document.getElementById("qCondition").value=q&&q.mode==="manual"?q.condition||"":""
document.getElementById("editorOverlay").style.display="block"
}
function saveEditor(){
const name=document.getElementById("qName").value.trim(),reward=document.getElementById("qReward").value.trim(),type=document.getElementById("qType").value,mode=document.getElementById("qMode").value,need=Math.max(0,Number(document.getElementById("qNeed").value||0)),condition=document.getElementById("qCondition").value.trim()
if(!name||!reward){toast("이름과 보상을 입력해주세요");return}if(mode==="stack"&&!need){toast("필요 STACK을 입력해주세요");return}if(mode==="manual"&&!condition){toast("필요조건을 입력해주세요");return}
if(editId){let oldType=["study","exercise","sleep"].find(t=>(state.quests[t]||[]).some(q=>q.id===editId)),q=state.quests[oldType].find(x=>x.id===editId);state.quests[oldType]=state.quests[oldType].filter(x=>x.id!==editId);q={...q,name,reward,mode,need,condition};state.quests[type].push(q)}
else state.quests[type].push({id:"q_"+Date.now(),name,reward,mode,need,condition})
save();document.getElementById("editorOverlay").style.display="none";render();if(document.getElementById("overlay").style.display==="block")renderManager();toast("저장했습니다")
}
function openHistory(){renderHistoryEditor();document.getElementById("historyOverlay").style.display="block"}
function renderHistory(){
const el=document.getElementById("history");if(!state.history.length){el.innerHTML='<div class="empty">아직 저장된 날짜가 없습니다</div>';return}
el.innerHTML=state.history.slice(0,14).map(x=>`<div class="history-row"><b>${x.date}</b><span>📚 ${x.study} · 🏃 ${x.exercise} · 😴 ${x.sleep}</span></div>`).join("")
}
function renderHistoryEditor(){
const el=document.getElementById("historyEditor");if(!state.history.length){el.innerHTML='<div class="empty">수정할 기록이 없습니다</div>';return}
el.innerHTML=state.history.map((x,i)=>`<div class="history-edit"><b>${x.date}</b><input data-h="${i}" data-k="study" type="number" min="0" value="${x.study}" placeholder="공부"><input data-h="${i}" data-k="exercise" type="number" min="0" max="1" value="${x.exercise}" placeholder="운동"><input data-h="${i}" data-k="sleep" type="number" min="0" max="1" value="${x.sleep}" placeholder="잠"><div class="row"><button class="mini clear" data-save-h="${i}">수정 저장</button><button class="mini danger" data-del-h="${i}">삭제</button></div></div>`).join("")
el.querySelectorAll("[data-save-h]").forEach(b=>b.onclick=()=>saveHistoryRow(+b.dataset.saveH));el.querySelectorAll("[data-del-h]").forEach(b=>b.onclick=()=>deleteHistoryRow(+b.dataset.delH))
}
function saveHistoryRow(i){
const x=state.history[i];const old={study:x.study,exercise:x.exercise,sleep:x.sleep};["study","exercise","sleep"].forEach(k=>{const v=Number(document.querySelector(`[data-h="${i}"][data-k="${k}"]`).value||0);x[k]=k==="study"?Math.max(0,v):Math.min(1,Math.max(0,v))});state.total.study=Math.max(0,state.total.study-old.study+x.study);state.total.exercise=Math.max(0,state.total.exercise-old.exercise+x.exercise);state.total.sleep=Math.max(0,state.total.sleep-old.sleep+x.sleep);save();render();renderHistoryEditor();toast("기록을 수정했습니다")
}
function deleteHistoryRow(i){if(!confirm("이 기록을 삭제할까요?"))return;const x=state.history[i];state.total.study=Math.max(0,state.total.study-x.study);state.total.exercise=Math.max(0,state.total.exercise-x.exercise);state.total.sleep=Math.max(0,state.total.sleep-x.sleep);state.history.splice(i,1);save();render();renderHistoryEditor();toast("기록을 삭제했습니다")}
function checkLevelUp(beforeStudy,afterStudy){
const oldIdx=levelIndex(beforeStudy),newIdx=levelIndex(afterStudy)
if(newIdx<=oldIdx)return
const l=LEVELS[newIdx];if(state.celebratedLevels.includes(newIdx))return
state.celebratedLevels.push(newIdx);save();showCelebrate("레벨업!","축하드립니다! 이제 "+l.name+" 단계입니다 ✨\\n"+CHEERS[Math.floor(Math.random()*CHEERS.length)],l.gem)
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.getElementById("manageBtn").onclick=openManager
document.getElementById("closeManager").onclick=()=>document.getElementById("overlay").style.display="none"
document.getElementById("addBtn").onclick=()=>openEditor(null)
document.getElementById("cancelEditor").onclick=()=>document.getElementById("editorOverlay").style.display="none"
document.getElementById("saveQuest").onclick=saveEditor
document.getElementById("historyBtn").onclick=openHistory
document.getElementById("closeHistory").onclick=()=>document.getElementById("historyOverlay").style.display="none"
document.getElementById("celebrateClose").onclick=()=>document.getElementById("celebrate").style.display="none"
render()
setInterval(()=>{if(rollover())render()},10000)
})();
</script>
</body>
</html>
